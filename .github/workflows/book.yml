name: Book cult classes

on:
  schedule:
    # GitHub cron is UTC. 10:00 PM IST (UTC+5:30) = 16:30 UTC.
    - cron: "30 16 * * *"
  workflow_dispatch: # lets you run it manually from the Actions tab

jobs:
  book:
    runs-on: ubuntu-latest
    environment: prod
    steps:
      # Kept lean on purpose: ubuntu-latest already ships Go, so no setup-go,
      # and tests live in test.yml instead of delaying every booking.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - run: go run ./cmd/booker
        env:
          CULT_COOKIE: ${{ secrets.CULT_COOKIE }}
          CULT_API_KEY: ${{ secrets.CULT_API_KEY }}
